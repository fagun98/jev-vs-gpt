<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jev vs GPT</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f4f5f7;
      color: #1c1c1c;
    }
    main {
      width: min(520px, calc(100% - 32px));
      padding: 40px 32px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    p { line-height: 1.5; color: #444; }
    h1 { margin: 0 0 8px; font-size: 2.2rem; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 22px;
      background: #1c1c1c;
      color: white;
      text-decoration: none;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Jev vs GPT</h1>
    <p>Pick three categories. Type an item. See which engine sorts it, and how fast.</p>
    <a href="/categories">Enter</a>
  </main>
</body>
</html>
