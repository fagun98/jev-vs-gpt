<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose categories</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f4f5f7;
      color: #1c1c1c;
    }
    main {
      width: min(520px, calc(100% - 32px));
      padding: 32px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    h1 { margin-top: 0; }
    p { color: #444; }
    label { display: block; margin: 14px 0; }
    input {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      border: 2px solid #3b82f6;
      border-radius: 12px;
      font: inherit;
    }
    input.green { border-color: #1f9d55; }
    input.red { border-color: #d64545; }
    .reason { display: block; min-height: 1.2em; margin-top: 4px; font-size: 0.9rem; }
    input.green + .reason { color: #1f9d55; }
    input.red + .reason { color: #d64545; }
    button {
      margin-top: 8px;
      padding: 12px 22px;
      border: 0;
      border-radius: 999px;
      background: #1c1c1c;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    a { color: #444; }
  </style>
</head>
<body>
  <main>
    <h1>Choose 3 categories</h1>
    <p>Leave a field to check it. Items that fit none of them go in Other.</p>
    <form id="form">
      <label>Category 1
        <input name="one" placeholder="Fruits" autocomplete="off">
        <span class="reason"></span>
      </label>
      <label>Category 2
        <input name="two" placeholder="Vegetables" autocomplete="off">
        <span class="reason"></span>
      </label>
      <label>Category 3
        <input name="three" placeholder="Vehicles" autocomplete="off">
        <span class="reason"></span>
      </label>
      <button id="start" type="submit" disabled>Start</button>
    </form>
    <p><a href="/">Back</a></p>
  </main>
  <script>
    const form = document.querySelector("#form");
    const start = document.querySelector("#start");
    const inputs = [...form.querySelectorAll("input")];

    function names() {
      return inputs.map((input) => input.value.trim());
    }

    function paint(input, color, reason) {
      input.classList.remove("green", "red");
      if (color === "green" || color === "red") input.classList.add(color);
      input.nextElementSibling.textContent = reason;
    }

    function refreshStart() {
      start.disabled = !inputs.every((input) => input.classList.contains("green"));
    }

    function otherNames(input) {
      return inputs
        .filter((other) => other !== input)
        .map((other) => other.value.trim())
        .filter((name) => name !== "");
    }

    inputs.forEach((input) => {
      input.dataset.checked = "";

      input.addEventListener("input", () => {
        if (input.value.trim() !== input.dataset.checked) {
          paint(input, "blue", "");
          input.dataset.checked = "";
        }
        refreshStart();
      });

      input.addEventListener("blur", () => {
        checkField(input);
      });
    });

    async function checkField(input) {
      const name = input.value.trim();
      if (!name) {
        paint(input, "blue", "");
        input.dataset.checked = "";
        refreshStart();
        return;
      }
      if (name === input.dataset.checked) return;
      paint(input, "blue", "Checking…");
      try {
        const response = await fetch("/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: name, others: otherNames(input) }),
        });
        const data = await response.json();
        if (input.value.trim() !== name) return;
        input.dataset.checked = name;
        if (data.error) {
          paint(input, "red", data.error);
        } else if (data.ok) {
          paint(input, "green", data.reason);
        } else {
          paint(input, "red", data.reason);
        }
      } catch (error) {
        if (input.value.trim() === name) paint(input, "red", "Could not reach the server.");
      }
      refreshStart();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (start.disabled) return;
      sessionStorage.setItem("categories", JSON.stringify(names()));
      window.location.href = "/play";
    });
  </script>
</body>
</html>
